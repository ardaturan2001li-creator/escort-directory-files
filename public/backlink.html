<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL Escort Backlink CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-8 text-slate-800" x-data="backlinkApp()">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg p-6 border border-slate-200">
        
        <!-- Header -->
        <div class="flex justify-between items-end border-b border-slate-200 pb-6 mb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">🔗 Backlink Fırsatları CRM</h1>
                <p class="text-slate-500 mt-2">Sıralama, filtreleme yapabilir ve domainlere özel notlar alabilirsiniz. Veriler tarayıcınıza kaydedilir.</p>
            </div>
            <div class="text-right text-sm font-medium text-slate-500">
                Toplam Kayıt: <span class="text-indigo-600 font-bold" x-text="domains.length"></span><br>
                Filtrelenen: <span class="text-emerald-600 font-bold" x-text="filteredDomains.length"></span>
            </div>
        </div>

        <!-- Filters -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">🔍 Domain veya Rakip Ara</label>
                <input type="text" x-model="search" placeholder="Örn: sexual.app.br veya eros.com..." 
                       class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">⭐ Fırsat Seviyesi</label>
                <select x-model="filterType" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="all">Tümü (530 Domain)</option>
                    <option value="gold">Altın Fırsatlar (2+ Rakip)</option>
                    <option value="super">Süper Fırsatlar (4+ Rakip)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">📌 İletişim Durumu</label>
                <select x-model="statusFilter" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="all">Tüm Durumlar</option>
                    <option value="Beklemede">Beklemede</option>
                    <option value="İletişime Geçildi">İletişime Geçildi</option>
                    <option value="Link Alındı">Link Alındı 🏆</option>
                    <option value="Reddedildi/Kapalı">Red/İşe Yaramaz ❌</option>
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-lg border border-slate-200">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-600 text-sm uppercase tracking-wider">
                        <th class="p-4 font-semibold border-b border-slate-200 w-1/5">Kaynak Domain</th>
                        <th class="p-4 font-semibold border-b border-slate-200 w-1/12 text-center">Rakip Say.</th>
                        <th class="p-4 font-semibold border-b border-slate-200 w-1/4">Link Verdiği Rakipler</th>
                        <th class="p-4 font-semibold border-b border-slate-200 w-1/6">Durum</th>
                        <th class="p-4 font-semibold border-b border-slate-200 w-1/3">Notlar</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-for="d in filteredDomains" :key="d.kaynak_domain">
                        <tr class="hover:bg-indigo-50/30 transition-colors">
                            
                            <!-- Domain -->
                            <td class="p-4 align-top">
                                <a :href="'https://' + d.kaynak_domain" target="_blank" 
                                   class="font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                                    <span x-text="d.kaynak_domain"></span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                </a>
                                <div class="mt-2 text-xs">
                                    <a :href="'https://whois.domaintools.com/' + d.kaynak_domain" target="_blank" class="text-slate-400 hover:text-slate-600 underline">WHOIS</a> • 
                                    <a :href="'https://www.google.com/search?q=site:' + d.kaynak_domain + '+contact+OR+email'" target="_blank" class="text-slate-400 hover:text-slate-600 underline">İletişim Bul</a>
                                </div>
                            </td>
                            
                            <!-- Count -->
                            <td class="p-4 align-top text-center">
                                <span class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-full text-xs font-bold"
                                      :class="{
                                        'bg-purple-100 text-purple-800': d.hedef_site_sayisi >= 4,
                                        'bg-amber-100 text-amber-800': d.hedef_site_sayisi >= 2 && d.hedef_site_sayisi < 4,
                                        'bg-slate-100 text-slate-600': d.hedef_site_sayisi < 2
                                      }" x-text="d.hedef_site_sayisi">
                                </span>
                            </td>
                            
                            <!-- Targets -->
                            <td class="p-4 align-top text-sm text-slate-500 leading-relaxed" x-text="d.hedef_siteler"></td>
                            
                            <!-- Status -->
                            <td class="p-4 align-top">
                                <select x-model="d.status" @change="saveNote(d.kaynak_domain)"
                                        class="w-full text-sm border border-slate-300 rounded-md p-1.5 outline-none font-medium"
                                        :class="{
                                            'bg-white text-slate-600': d.status === 'Beklemede',
                                            'bg-blue-50 text-blue-700 border-blue-200': d.status === 'İletişime Geçildi',
                                            'bg-emerald-50 text-emerald-700 border-emerald-200': d.status === 'Link Alındı',
                                            'bg-red-50 text-red-700 border-red-200': d.status === 'Reddedildi/Kapalı'
                                        }">
                                    <option value="Beklemede">⏳ Beklemede</option>
                                    <option value="İletişime Geçildi">📧 İletişime Geçildi</option>
                                    <option value="Link Alındı">✅ Link Alındı</option>
                                    <option value="Reddedildi/Kapalı">❌ İptal/Uygun Değil</option>
                                </select>
                            </td>
                            
                            <!-- Notes -->
                            <td class="p-4 align-top">
                                <textarea x-model="d.note" @input.debounce.500ms="saveNote(d.kaynak_domain)"
                                          rows="2" placeholder="Notlarınızı buraya yazın..." 
                                          class="w-full text-sm border border-slate-300 rounded-md p-2 outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                            </td>
                        </tr>
                    </template>

                        <td colspan="5" class="p-8 text-center text-slate-500">
                            Arama kriterlerinize uyan domain bulunamadı.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
